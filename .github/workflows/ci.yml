name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile, unit tests, compile device tests
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin
      - name: Test report
        if: failure()
        run: |
          find app/build/test-results -name '*.xml' -print0 2>/dev/null | xargs -0 -r grep -l -E '<(failure|error)' | head -20 | while read -r f; do echo "== $f"; grep -A 30 -E '<(failure|error)' "$f" | head -80; done
