name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint baseline (first run only)
        run: |
          if [ ! -f app/lint-baseline.xml ]; then
            ./gradlew --no-daemon :app:updateLintBaseline || true
            echo "=====LINT BASELINE"; base64 -w 8000 app/lint-baseline.xml || true; echo "=====END"
          fi
      - name: Compile, unit tests, compile device tests, lint, shrunk release
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:lintDebug :app:assembleRelease
      - name: Release APK size
        if: always()
        run: ls -la app/build/outputs/apk/release/ app/build/outputs/mapping/release/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
      - name: Test report
        if: failure()
        run: |
          find app/build/test-results -name '*.xml' -print0 2>/dev/null | xargs -0 -r grep -l -E '<(failure|error)' | head -20 | while read -r f; do echo "== $f"; grep -A 30 -E '<(failure|error)' "$f" | head -80; done

  screenshots:
    # Pictures of the editor on a tablet emulator, to look at changes of the interface.
    if: github.event_name == 'workflow_dispatch' || contains(github.ref, 'toolbars') || contains(github.ref, 'v0.3')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build (shrunk by R8, as release is)
        run: ./gradlew --no-daemon -PtestMinified :app:assembleMinified :app:assembleMinifiedAndroidTest
      - name: Screenshots on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          disable-animations: true
          script: |
            adb shell settings put global hide_error_dialogs 1 || true
            adb install -r app/build/outputs/apk/minified/app-minified.apk
            adb install -r app/build/outputs/apk/androidTest/minified/app-minified-androidTest.apk
            if [ ! -d app/src/androidTest/assets/golden ]; then adb shell am instrument -w -e golden make -e class dev.inknotes.data.GoldenFilesTest#make dev.inknotes.test/androidx.test.runner.AndroidJUnitRunner; mkdir -p golden && adb pull /sdcard/Android/data/dev.inknotes/files/golden golden; for f in golden/golden/*; do echo "=====GOLDEN $(basename $f)"; base64 -w 8000 $f; echo "=====END"; done; fi
            adb shell am instrument -w -e shots 1 -e class dev.inknotes.ui.V032Screenshots,dev.inknotes.ui.V033Screenshots,dev.inknotes.ui.V034Screenshots,dev.inknotes.ui.V035Screenshots,dev.inknotes.ui.V036Screenshots dev.inknotes.test/androidx.test.runner.AndroidJUnitRunner || true
            adb shell am instrument -w -e package dev.inknotes.data dev.inknotes.test/androidx.test.runner.AndroidJUnitRunner > data-tests.txt 2>&1 || true
            cat data-tests.txt
            adb logcat -d -b crash | tail -120 || true
            adb logcat -d -b main -t 3000 | grep -iE "inknotes|hwui|OpenGLRenderer|EGL|RenderThread" | tail -60 || true
            mkdir -p shots && adb pull /sdcard/Android/data/dev.inknotes/files/shots shots || true
            grep -q "^OK (" data-tests.txt
      - name: Screenshots into the log
        # Artifacts cannot always be downloaded where the work is reviewed: smaller JPEGs, base64.
        if: always()
        run: |
          pip install -q pillow
          python3 - <<'PY'
          import glob, base64, io, os
          from PIL import Image
          for f in sorted(glob.glob('shots/**/*.png', recursive=True)):
              im = Image.open(f).convert('RGB')
              im = im.resize((im.width * 6 // 10, im.height * 6 // 10))
              b = io.BytesIO(); im.save(b, 'JPEG', quality=80)
              print('=====SHOT ' + os.path.basename(f)[:-4])
              data = base64.b64encode(b.getvalue()).decode()
              # Long lines are dropped from the log: in pieces.
              for i in range(0, len(data), 8000):
                  print(data[i:i + 8000])
              print('=====END')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots
