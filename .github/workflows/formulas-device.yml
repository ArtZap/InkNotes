name: Formulas on a device

# The formula bench with the real handwriting reader (ML Kit) on an emulator: single symbols
# (level 0, SymbolReadTest) and whole formulas (FormulaReadTest). CROHME is research data: it
# goes to the test device only. By hand, and whenever the math or these tests change. The symbol
# and formula figures only measure; two real pages (RealPagesTest) must keep every answer.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths:
      - app/src/androidTest/java/dev/inknotes/math/SymbolReadTest.kt
      - app/src/androidTest/java/dev/inknotes/math/FormulaReadTest.kt
      - app/src/test/java/dev/inknotes/math/FormulaExportTest.kt
      - app/src/sharedTest/**
      - app/build.gradle.kts
      - app/src/main/java/dev/inknotes/math/**
      - tools/crohme_symbols.py
      - .github/workflows/formulas-device.yml
      - app/src/androidTest/java/dev/inknotes/InkTestRunner.kt

concurrency:
  group: formulas-device-${{ github.ref }}
  cancel-in-progress: true

jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: build/crohme
          key: crohme-e5fa1924a89558b97086f15dde2ac4c2420e86d1
      - name: Symbols
        run: |
          tools/formula-bench.sh --fetch
          python3 tools/crohme_symbols.py build/crohme/CROHME_full_v2 symbols.tsv 4000
      - name: Formulas
        env:
          CROHME_DIR: ${{ github.workspace }}/build/crohme/CROHME_full_v2
          FORMULA_EXPORT: ${{ github.workspace }}/formulas.tsv
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests 'dev.inknotes.math.FormulaExportTest' --rerun
      - name: Build
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Read symbols and formulas on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell mkdir -p /sdcard/Android/data/dev.inknotes/files/level0
            adb push symbols.tsv /sdcard/Android/data/dev.inknotes/files/level0/symbols.tsv
            adb shell mkdir -p /sdcard/Android/data/dev.inknotes/files/level1
            adb push formulas.tsv /sdcard/Android/data/dev.inknotes/files/level1/formulas.tsv
            adb shell am instrument -w -e class dev.inknotes.math.SymbolReadTest dev.inknotes.test/dev.inknotes.InkTestRunner || true
            adb shell am instrument -w -e class dev.inknotes.math.FormulaReadTest dev.inknotes.test/dev.inknotes.InkTestRunner || true
            # The math checks on two real pages, in Russian and in English: every answer as before.
            # This one blocks: a change in the layout that turns a user's answer is a regression.
            adb shell am instrument -w -e class dev.inknotes.math.RealPagesTest dev.inknotes.test/dev.inknotes.InkTestRunner | tee math-ru.txt || true
            adb shell am instrument -w -e lang en -e class dev.inknotes.math.RealPagesTest dev.inknotes.test/dev.inknotes.InkTestRunner | tee math-en.txt || true
            adb pull /sdcard/Android/data/dev.inknotes/files/level0/report.txt level0-report.txt || true
            adb pull /sdcard/Android/data/dev.inknotes/files/level1/report.txt level1-report.txt || true
            cat level0-report.txt level1-report.txt || adb logcat -d | grep -i "SymbolReadTest\|FormulaReadTest\|mlkit\|digitalink" | tail -60
            grep -q "^OK (" math-ru.txt && grep -q "^OK (" math-en.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formulas-device-report
          path: level*-report.txt
